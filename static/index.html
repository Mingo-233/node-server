<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f0f23" />
    <title>停车位置信息记录</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        background: #0f0f23;
        min-height: 100%;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(
          135deg,
          #0f0f23 0%,
          #1a1a2e 50%,
          #16213e 100%
        );
        background-attachment: fixed;
        color: #e0e6ed;
        min-height: 100vh;
        padding: calc(20px + env(safe-area-inset-top)) calc(
            20px + env(safe-area-inset-right)
          )
          calc(20px + env(safe-area-inset-bottom)) calc(
            20px + env(safe-area-inset-left)
          );
        position: relative;
        overflow-x: hidden;
      }

      .container {
        max-width: 420px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      h2 {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 30px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 30px rgba(102, 126, 234, 0.3);
        animation: glow 2s ease-in-out infinite alternate;
      }

      @keyframes glow {
        0% {
          text-shadow: 0 0 10px rgba(102, 126, 234, 0.3),
            0 0 20px rgba(102, 126, 234, 0.3), 0 0 30px rgba(102, 126, 234, 0.3);
          transform: scale(1);
        }
        50% {
          text-shadow: 0 0 20px rgba(102, 126, 234, 0.8),
            0 0 30px rgba(102, 126, 234, 0.8), 0 0 40px rgba(102, 126, 234, 0.8),
            0 0 50px rgba(102, 126, 234, 0.5);
          transform: scale(1.02);
        }
        100% {
          text-shadow: 0 0 10px rgba(102, 126, 234, 0.3),
            0 0 20px rgba(102, 126, 234, 0.3), 0 0 30px rgba(102, 126, 234, 0.3);
          transform: scale(1);
        }
      }

      .card {
        background: rgba(26, 26, 46, 0.8);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        animation: slideInUp 0.6s ease-out;
      }

      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .form-group {
        margin-bottom: 20px;
        position: relative;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        font-size: 14px;
        color: #a8b2d1;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      input[type="text"] {
        width: 100%;
        padding: 16px 20px;
        background: rgba(15, 15, 35, 0.9);
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: #e0e6ed;
        font-size: 16px;
        transition: all 0.3s ease;
        appearance: none;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2),
          0 0 20px rgba(102, 126, 234, 0.3);
      }

      .photo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .photo-item {
        position: relative;
        aspect-ratio: 1;
        border-radius: 12px;
        overflow: hidden;
        background: rgba(15, 15, 35, 0.9);
        border: 2px solid rgba(255, 255, 255, 0.1);
        animation: slideInUp 0.4s ease-out;
      }

      .photo-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        cursor: zoom-in;
        display: block;
      }

      .photo-delete {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: rgba(238, 90, 82, 0.9);
        color: white;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      }

      .photo-add {
        aspect-ratio: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 2px dashed rgba(102, 126, 234, 0.5);
        border-radius: 12px;
        cursor: pointer;
        color: #667eea;
        background: rgba(102, 126, 234, 0.06);
        transition: all 0.3s ease;
        gap: 4px;
      }

      .photo-add:hover {
        background: rgba(102, 126, 234, 0.18);
        border-color: #667eea;
        transform: translateY(-2px);
      }

      .photo-add-icon {
        font-size: 28px;
      }

      .photo-add-text {
        font-size: 12px;
        font-weight: 600;
      }

      .empty-photo-hint {
        text-align: center;
        padding: 30px 10px 10px;
        color: #6b7280;
        font-size: 13px;
      }

      .time-info {
        background: linear-gradient(
          135deg,
          rgba(26, 42, 62, 0.9) 0%,
          rgba(15, 15, 35, 0.9) 100%
        );
        border: 1px solid rgba(102, 126, 234, 0.3);
        border-radius: 16px;
        padding: 16px 20px;
        margin: 20px 0;
        box-shadow: 0 0 0 1px rgba(102, 126, 234, 0.15);
      }

      .time-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
      }

      .time-row + .time-row {
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .time-label {
        font-size: 14px;
        color: #a8b2d1;
        font-weight: 600;
      }

      .time-value {
        font-family: "Courier New", monospace;
        font-weight: 600;
        color: #e0e6ed;
      }

      #result-time {
        font-size: 18px;
        color: #4facfe;
        text-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.75;
        }
      }

      .btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 12px;
      }

      .btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s;
      }

      .btn:hover::before {
        left: 100%;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn:disabled {
        background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .btn-info {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      }

      .btn-info:hover {
        box-shadow: 0 10px 25px rgba(79, 172, 254, 0.4);
      }

      .btn-danger {
        background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
      }

      .btn-danger:hover {
        box-shadow: 0 10px 25px rgba(238, 90, 82, 0.4);
      }

      .btn-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .btn-row .btn {
        margin-bottom: 0;
        padding: 14px 8px;
        font-size: 13px;
      }

      ::placeholder {
        color: #6b7280;
      }

      .success-feedback {
        position: fixed;
        top: calc(20px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
        color: white;
        padding: 12px 24px;
        border-radius: 25px;
        box-shadow: 0 4px 15px rgba(72, 187, 120, 0.3);
        z-index: 1100;
        animation: successSlide 3s ease-out;
        max-width: 90%;
        text-align: center;
      }

      @keyframes successSlide {
        0% {
          opacity: 0;
          transform: translateX(-50%) translateY(-100%);
        }
        15%,
        85% {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(-100%);
        }
      }

      .photo-viewer {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        z-index: 1200;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .photo-viewer.show {
        display: flex;
      }

      .photo-viewer img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 8px;
      }

      .photo-viewer-close {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border: none;
        font-size: 22px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @media (max-width: 480px) {
        body {
          padding: calc(15px + env(safe-area-inset-top)) calc(
              15px + env(safe-area-inset-right)
            )
            calc(15px + env(safe-area-inset-bottom)) calc(
              15px + env(safe-area-inset-left)
            );
        }

        .card {
          padding: 20px;
          border-radius: 16px;
        }

        h2 {
          font-size: 24px;
          margin-bottom: 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>🚗 Parking Information</h2>

      <div class="card">
        <label>📷 停车照片</label>
        <div class="photo-grid" id="photo-grid"></div>
        <div
          class="empty-photo-hint"
          id="empty-photo-hint"
          style="display: none"
        >
          点击上方按钮拍摄停车位照片，可拍摄多张
        </div>
        <input
          type="file"
          id="photo-input"
          accept="image/*"
          capture="environment"
          style="display: none"
        />

        <div class="form-group" style="margin-top: 22px; margin-bottom: 0">
          <label for="remark">📝 备注</label>
          <input type="text" id="remark" placeholder="额外信息（可选）" />
        </div>

        <div class="time-info" id="time-info" style="display: none">
          <div class="time-row">
            <span class="time-label">停车开始时间</span>
            <span class="time-value" id="result-start-time"></span>
          </div>
          <div class="time-row">
            <span class="time-label">已停车时长</span>
            <span class="time-value" id="result-time">00:00:00</span>
          </div>
        </div>

        <div style="margin-top: 20px">
          <button class="btn" id="save-btn" onclick="saveParkingInfo()">
            💾 保存停车信息
          </button>
          <button class="btn btn-danger" onclick="clearAll()">🗑️ 清空</button>
          <div class="btn-row">
            <button class="btn btn-info" id="test-btn" onclick="testNotify()">
              🔔 Mock Test
            </button>
            <button class="btn btn-info" onclick="checkNotifyStatus()">
              📊 通知状态
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="photo-viewer" id="photo-viewer" onclick="closeViewer()">
      <button class="photo-viewer-close" onclick="closeViewer()">✕</button>
      <img id="viewer-img" alt="" />
    </div>

    <script>
      const STORAGE_KEY = "PARKING_INFO";
      let parkingInfo = { photos: [], remark: "", time: null };
      let timer = null;

      const photoInput = document.getElementById("photo-input");
      const photoGrid = document.getElementById("photo-grid");
      const emptyHint = document.getElementById("empty-photo-hint");
      const remarkDom = document.getElementById("remark");
      const timeInfoDom = document.getElementById("time-info");
      const resultTimeDom = document.getElementById("result-time");
      const resultStartTimeDom = document.getElementById("result-start-time");
      const saveBtnDom = document.getElementById("save-btn");

      document.addEventListener("DOMContentLoaded", () => {
        loadParkingInfo();
        photoInput.addEventListener("change", handlePhotoSelect);
      });

      function loadParkingInfo() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            parkingInfo = {
              photos: Array.isArray(parsed.photos) ? parsed.photos : [],
              remark: parsed.remark || "",
              time: parsed.time || null,
            };
          } catch {
            parkingInfo = { photos: [], remark: "", time: null };
          }
        }
        remarkDom.value = parkingInfo.remark || "";
        renderPhotos();
        if (parkingInfo.time) {
          showTimeInfo();
          startTimer();
        }
      }

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(parkingInfo));
        } catch (e) {
          console.error("Persist failed:", e);
          showSuccessFeedback("存储空间不足，请删除部分照片");
        }
      }

      function renderPhotos() {
        photoGrid.innerHTML = "";
        parkingInfo.photos.forEach((photo, idx) => {
          const item = document.createElement("div");
          item.className = "photo-item";
          const img = document.createElement("img");
          img.src = photo;
          img.alt = `photo-${idx}`;
          img.addEventListener("click", () => viewPhoto(idx));
          const del = document.createElement("button");
          del.className = "photo-delete";
          del.textContent = "✕";
          del.addEventListener("click", (e) => {
            e.stopPropagation();
            deletePhoto(idx);
          });
          item.appendChild(img);
          item.appendChild(del);
          photoGrid.appendChild(item);
        });
        const addBtn = document.createElement("div");
        addBtn.className = "photo-add";
        addBtn.innerHTML =
          '<span class="photo-add-icon">📷</span><span class="photo-add-text">拍摄</span>';
        addBtn.addEventListener("click", () => photoInput.click());
        photoGrid.appendChild(addBtn);

        emptyHint.style.display = parkingInfo.photos.length ? "none" : "block";
      }

      function handlePhotoSelect(e) {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        Promise.all(files.map(compressImage))
          .then((results) => {
            parkingInfo.photos.push(...results);
            persist();
            renderPhotos();
          })
          .catch((err) => {
            console.error("Compress failed:", err);
            showSuccessFeedback("照片处理失败");
          });
        e.target.value = "";
      }

      function compressImage(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(reader.error);
          reader.onload = (e) => {
            const img = new Image();
            img.onerror = () => reject(new Error("image load failed"));
            img.onload = () => {
              const canvas = document.createElement("canvas");
              const maxSize = 1280;
              let { width, height } = img;
              if (width > height && width > maxSize) {
                height = Math.round((height * maxSize) / width);
                width = maxSize;
              } else if (height > maxSize) {
                width = Math.round((width * maxSize) / height);
                height = maxSize;
              }
              canvas.width = width;
              canvas.height = height;
              canvas.getContext("2d").drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL("image/jpeg", 0.7));
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      function deletePhoto(idx) {
        if (!confirm("删除这张照片？")) return;
        parkingInfo.photos.splice(idx, 1);
        persist();
        renderPhotos();
      }

      function viewPhoto(idx) {
        const viewer = document.getElementById("photo-viewer");
        document.getElementById("viewer-img").src = parkingInfo.photos[idx];
        viewer.classList.add("show");
      }

      function closeViewer() {
        document.getElementById("photo-viewer").classList.remove("show");
      }

      function saveParkingInfo() {
        if (parkingInfo.photos.length === 0) {
          alert("请至少拍摄一张停车照片");
          return;
        }

        saveBtnDom.disabled = true;
        const originalText = saveBtnDom.textContent;
        saveBtnDom.textContent = "💾 保存中...";

        const isFirstSave = !parkingInfo.time;
        parkingInfo.remark = remarkDom.value;
        if (isFirstSave) {
          parkingInfo.time = Date.now();
        }
        persist();

        setTimeout(() => {
          saveBtnDom.disabled = false;
          saveBtnDom.textContent = originalText;
          showTimeInfo();
          startTimer();
          showSuccessFeedback("停车信息保存成功！");
          if (isFirstSave) notify();
        }, 400);
      }

      function showTimeInfo() {
        timeInfoDom.style.display = "block";
        resultStartTimeDom.textContent = formatDateTime(parkingInfo.time);
      }

      function startTimer() {
        if (timer) clearInterval(timer);
        updateElapsedTime();
        timer = setInterval(updateElapsedTime, 1000);
      }

      function updateElapsedTime() {
        if (!parkingInfo.time) return;
        const past = Date.now() - parkingInfo.time;
        const hour = Math.floor(past / 1000 / 60 / 60);
        const minute = Math.floor(past / 1000 / 60) % 60;
        const second = Math.floor(past / 1000) % 60;
        const pad = (n) => (n < 10 ? "0" + n : "" + n);
        resultTimeDom.textContent = `${pad(hour)}:${pad(minute)}:${pad(
          second
        )}`;
      }

      async function clearAll() {
        if (!confirm("确定要清空所有照片和备注信息吗？")) return;

        localStorage.removeItem(STORAGE_KEY);
        parkingInfo = { photos: [], remark: "", time: null };
        remarkDom.value = "";
        if (timer) clearInterval(timer);
        timer = null;
        timeInfoDom.style.display = "none";
        resultTimeDom.textContent = "00:00:00";
        renderPhotos();

        try {
          const res = await fetch("./clear");
          const data = await res.json();
          const prev = data?.data?.previousNotifyCount ?? 0;
          showSuccessFeedback(`已清空（之前已发送 ${prev} 次通知）`);
        } catch (error) {
          console.error("Clear tasks failed:", error);
          showSuccessFeedback("已清空（清空通知任务失败）");
        }
      }

      async function notify() {
        try {
          const res = await fetch("./notify");
          const data = await res.json();
          if (data.code === 200) {
            showSuccessFeedback("停车通知任务已启动！将在50分钟后开始提醒");
          } else {
            showSuccessFeedback("启动通知任务失败！");
          }
        } catch (error) {
          console.error("Notify failed:", error);
          showSuccessFeedback("启动通知任务失败！");
        }
      }

      async function testNotify() {
        const testBtn = document.getElementById("test-btn");
        const originalText = testBtn.textContent;
        testBtn.disabled = true;
        testBtn.textContent = "🔔 测试中...";
        try {
          await fetch("./mock");
          showSuccessFeedback("Mock 测试成功！");
        } catch (error) {
          console.error("Mock test failed:", error);
          showSuccessFeedback("Mock 测试失败！");
        } finally {
          setTimeout(() => {
            testBtn.disabled = false;
            testBtn.textContent = originalText;
          }, 1000);
        }
      }

      async function checkNotifyStatus() {
        try {
          const res = await fetch("./status");
          const data = await res.json();
          if (data.code === 200) {
            const s = data.data;
            const message = `
通知状态信息：
• 当前通知次数：${s.currentNotifyCount}/${s.maxNotifyCount}
• 剩余通知次数：${s.remainingNotifyCount}
• 任务状态：${s.taskStatus}
• 是否执行中：${s.running ? "是" : "否"}
• 下一次触发时间：${formatDateTime(s.nextFireAt)}
• 任务开始时间：${formatDateTime(s.startAt)}
            `.trim();
            alert(message);
          } else {
            showSuccessFeedback("获取状态失败！");
          }
        } catch (error) {
          console.error("Check status failed:", error);
          showSuccessFeedback("获取状态失败！");
        }
      }

      function formatDateTime(val) {
        if (!val) return "—";
        const d = new Date(val);
        if (isNaN(d.getTime())) return "—";
        const pad = (n) => (n < 10 ? "0" + n : "" + n);
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(
          d.getDate()
        )} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      }

      function showSuccessFeedback(message) {
        const feedback = document.createElement("div");
        feedback.className = "success-feedback";
        feedback.textContent = message;
        document.body.appendChild(feedback);
        setTimeout(() => {
          if (feedback.parentNode) feedback.parentNode.removeChild(feedback);
        }, 3000);
      }

      remarkDom.addEventListener("blur", () => {
        if (parkingInfo.time) {
          parkingInfo.remark = remarkDom.value;
          persist();
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (timer) clearInterval(timer);
          timer = null;
        } else if (parkingInfo.time) {
          startTimer();
        }
      });
    </script>
  </body>
</html>
